name: Tests de performance Gatling

on:
  push:
    branches: [main]
  workflow_dispatch:             # lancement manuel depuis l'onglet Actions
    inputs:
      profile:
        description: 'Profil de charge'
        type: choice
        options: [smoke, load, stress]
        default: smoke
      usersPerSec:
        description: 'Utilisateurs par seconde (profil load)'
        default: '2'
      durationSec:
        description: 'Durée du palier en secondes (profil load)'
        default: '120'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Lancer la simulation Gatling
        run: >
          mvn -B gatling:test
          -Dprofile=${{ inputs.profile || 'smoke' }}
          -DusersPerSec=${{ inputs.usersPerSec || '2' }}
          -DdurationSec=${{ inputs.durationSec || '120' }}

      - name: Préparer le rapport
        if: ${{ !cancelled() }}
        run: |
          REPORT_DIR=$(ls -td target/gatling/*/ | head -1)
          echo "Rapport : $REPORT_DIR"
          mkdir -p site
          cp -r "$REPORT_DIR"/. site/

      - name: Sauvegarder le rapport (artefact téléchargeable)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report-${{ inputs.profile || 'smoke' }}
          path: site/
          retention-days: 14

      - name: Préparer le rapport pour GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-report:
    needs: perf
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le rapport sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
